name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.85.0
          - stable
    steps:
      - uses: actions/checkout@v6
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libvte-2.91-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev
      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Run Clippy
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --all-features --locked

  meson:
    name: Meson and C reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            docbook-xsl \
            gettext \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libpcre2-dev \
            libutempter-dev \
            libvte-2.91-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev \
            meson \
            xsltproc
      - name: Build the mixed tree
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs
      - name: Run the Rust candidate
        run: ./build/rust/xfce4-terminal-rs
      - name: Build the frozen C reference
        run: |
          docker build \
            --file tests/reference/Containerfile \
            --tag xfce4-terminal-reference \
            .
          mkdir "$RUNNER_TEMP/xfce4-terminal-reference"
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/repository,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/xfce4-terminal-reference,target=/output" \
            xfce4-terminal-reference
          reference_binary="$RUNNER_TEMP/xfce4-terminal-reference/build/terminal/xfce4-terminal"
          test -x "$reference_binary"
          if tests/reference/differential.sh \
            "$reference_binary" \
            ./build/rust/xfce4-terminal-rs \
            "$RUNNER_TEMP/version-parity" \
            -- --version
          then
            echo "Version behavior already matches."
          else
            test "$?" -eq 1
            echo "Version difference captured for issue #2."
          fi
          test -f "$RUNNER_TEMP/version-parity/reference.stdout"
          test -f "$RUNNER_TEMP/version-parity/candidate.stdout"
