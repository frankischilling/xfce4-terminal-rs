name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.85.0
          - stable
    steps:
      - uses: actions/checkout@v6
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libpcre2-dev \
            libvte-2.91-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev \
            xfconf \
            xvfb
      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Run Clippy
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --all-features --locked

  meson:
    name: Meson and C reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            docbook-xsl \
            gettext \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libpcre2-dev \
            libutempter-dev \
            libvte-2.91-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev \
            meson \
            xauth \
            xvfb \
            xsltproc
      - name: Build the mixed tree
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs
      - name: Run the Rust candidate
        run: ./build/rust/xfce4-terminal-rs
      - name: Build the frozen C reference
        run: |
          docker build \
            --file tests/reference/Containerfile \
            --tag xfce4-terminal-reference \
            .
          mkdir "$RUNNER_TEMP/xfce4-terminal-reference"
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/repository,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/xfce4-terminal-reference,target=/output" \
            xfce4-terminal-reference
          reference_binary="$RUNNER_TEMP/xfce4-terminal-reference/build/terminal/xfce4-terminal"
          reference_options="$RUNNER_TEMP/xfce4-terminal-reference/build/options-probe"
          reference_preferences="$RUNNER_TEMP/xfce4-terminal-reference/build/preferences-probe"
          reference_links="$RUNNER_TEMP/xfce4-terminal-reference/build/link-probe"
          reference_call_probe="$RUNNER_TEMP/xfce4-terminal-reference/build/application-call-probe.so"
          candidate_options="./build/rust/cargo-target/release/xfce4-terminal-options-probe"
          candidate_preferences="./build/rust/cargo-target/release/xfce4-terminal-preferences-probe"
          candidate_accelerators="./build/rust/cargo-target/release/xfce4-terminal-accelerator-probe"
          candidate_links="./build/rust/cargo-target/release/xfce4-terminal-link-probe"
          test -x "$reference_binary"
          test -x "$reference_options"
          test -x "$reference_preferences"
          test -x "$reference_links"
          test -f "$reference_call_probe"
          test -x "$candidate_options"
          test -x "$candidate_preferences"
          test -x "$candidate_accelerators"
          test -x "$candidate_links"

          XFCE4_TERMINAL_REFERENCE_PREFERENCES_PROBE="$reference_preferences" \
            cargo test --test preferences_parity --locked
          tests/reference/preferences-behavior.sh \
            "$reference_preferences" \
            "$candidate_preferences"
          tests/reference/application-calls.sh \
            "$reference_binary" \
            "$candidate_accelerators" \
            "$reference_call_probe"
          tests/reference/link-matching.sh \
            "$reference_links" \
            "$candidate_links"

          mkdir "$RUNNER_TEMP/xfce4-terminal-candidate-install"
          DESTDIR="$RUNNER_TEMP/xfce4-terminal-candidate-install" \
            meson install -C build
          diff --recursive --unified \
            "$RUNNER_TEMP/xfce4-terminal-reference/install/usr/local/share/xfce4/terminal/colorschemes" \
            "$RUNNER_TEMP/xfce4-terminal-candidate-install/usr/local/share/xfce4/terminal/colorschemes"
          diff --recursive --unified \
            "$RUNNER_TEMP/xfce4-terminal-reference/install/usr/local/share/locale" \
            "$RUNNER_TEMP/xfce4-terminal-candidate-install/usr/local/share/locale"

          for option in help version color-table
          do
            xvfb-run --auto-servernum tests/reference/differential.sh \
              "$reference_binary" \
              ./build/rust/xfce4-terminal-rs \
              "$RUNNER_TEMP/$option-parity" \
              -- "--$option"
          done

          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-defaults" \
            -- \
            --default-display=:7 \
            --default-working-directory=/tmp \
            --title=first \
            --tab \
            --working-directory=/var \
            --window \
            --display=:8
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-grouped" \
            -- -HTgrouped -x printf %s hello
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-grouped-execute" \
            -- -Hx echo
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-inline-execute-error" \
            -- -xecho --help
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-unicode-error" \
            -- '-é'
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-byte-command" \
            -- -x echo $'\xff'
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-byte-title" \
            -- --title $'\xff'
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-inline-byte-title" \
            -- $'--title=\xff'
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-delimited-byte" \
            -- -- $'-\xff'
          tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-error" \
            -- --zoom=8
          CAN_REUSE_WINDOW=1 tests/reference/differential.sh \
            "$reference_options" \
            "$candidate_options" \
            "$RUNNER_TEMP/options-reuse" \
            -- --tab --title=reused --window --title=new
