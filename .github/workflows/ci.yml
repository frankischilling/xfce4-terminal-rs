name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.85.0
          - 1.95.0
    steps:
      - uses: actions/checkout@v6
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libvte-2.91-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev
      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
      - name: Check formatting
        if: matrix.toolchain == '1.95.0'
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Run Clippy
        if: matrix.toolchain == '1.95.0'
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --all-features --locked

  meson:
    name: Meson and C reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            docbook-xsl \
            gettext \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libpcre2-dev \
            libutempter-dev \
            libvte-2.91-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev \
            meson \
            xsltproc
      - name: Build the mixed tree
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs
      - name: Run the Rust candidate
        run: ./build/rust/xfce4-terminal-rs
      - name: Build the frozen C reference
        run: |
          reference_binary=$(tests/reference/build-reference.sh "$RUNNER_TEMP/xfce4-terminal-reference" | tail -n 1)
          test -x "$reference_binary"

